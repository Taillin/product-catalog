<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Детали товара</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .detail-card { border: none; border-radius: 16px; overflow: hidden; }
        .product-img { max-height: 450px; object-fit: cover; width: 100%; background-color: #eaeaea; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="bi bi-shop me-2"></i>ProductCatalog</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow detail-card bg-white p-0">
        <div class="row g-0">
            <div class="col-md-6">
                <img th:src="${product.imageUrl != null && !product.imageUrl.isEmpty() ? product.imageUrl : 'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500&auto=format&fit=crop&q=60'}"
                     class="product-img h-100" alt="Product Image">
            </div>
            <div class="col-md-6 p-5 d-flex flex-column justify-content-center">
                <span class="badge bg-primary-subtle text-primary align-self-start mb-3 px-3 py-2 rounded-pill fw-semibold"
                      th:text="${product.category}">Категория</span>

                <h1 class="fw-bold text-dark mb-2" th:text="${product.name}">Название товара</h1>
                <p class="text-muted small mb-4">ID товара: <span th:text="${product.id}">0</span></p>

                <h2 class="text-success fw-bold mb-4" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 0, 'POINT')} + ' KZT'">0 KZT</h2>

                <h5 class="fw-semibold text-secondary mb-2">Описание:</h5>
                <p class="text-muted lead fs-6 mb-4" th:text="${product.description != null && !product.description.isEmpty() ? product.description : 'Описание отсутствует.'}">Описание товара</p>

                <div class="d-flex gap-2 mt-4 pt-4 border-top">
                    <a th:href="@{/products}" class="btn btn-light border px-4"><i class="bi bi-arrow-left"></i> К каталогу</a>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning px-4"><i class="bi bi-pencil"></i> Редактировать</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
