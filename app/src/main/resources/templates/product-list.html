<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .product-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: none;
            border-radius: 12px;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
        }
        .card-img-top {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            height: 220px;
            object-fit: cover;
            background-color: #eaeaea;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products">
            <i class="bi bi-shop me-2"></i>ProductCatalog
        </a>
        <a th:href="@{/products/new}" class="btn btn-success btn-sm px-3 rounded-pill">
            <i class="bi bi-plus-circle me-1"></i> Добавить товар
        </a>
    </div>
</nav>

<div class="container">
    <div class="card p-4 mb-4 border-0 shadow-sm rounded-3 bg-white">
        <h5 class="mb-3 text-secondary fw-semibold"><i class="bi bi-sliders me-2"></i>Фильтры и поиск</h5>
        <form th:action="@{/products}" method="get" class="row g-3">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="search" th:value="${search}" class="form-control bg-light border-start-0" placeholder="Поиск по названию...">
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-tag text-muted"></i></span>
                    <input type="text" name="category" th:value="${category}" class="form-control bg-light border-start-0" placeholder="Категория...">
                </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Найти</button>
                <a th:href="@{/products}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i></a>
            </div>
        </form>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 shadow-sm product-card">
                <img th:src="${product.imageUrl != null && !product.imageUrl.isEmpty() ? product.imageUrl : 'https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500&auto=format&fit=crop&q=60'}"
                     class="card-img-top" alt="product image">

                <div class="card-body d-flex flex-column p-4">
                    <span class="badge bg-light text-primary border border-primary-subtle align-self-start mb-2 px-2.5 py-1.5 rounded-pill"
                          th:text="${product.category != null && !product.category.isEmpty() ? product.category : 'Без категории'}">Категория</span>

                    <h5 class="card-title fw-bold text-dark mb-2" th:text="${product.name}">Название</h5>
                    <p class="card-text text-muted small text-truncate-2 flex-grow-1" th:text="${product.description}">Описание</p><div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                    <span class="fs-5 fw-bold text-success" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 0, 'POINT')} + ' KZT'">0 KZT</span>
                </div>

                    <div class="btn-group mt-3" role="group">
                        <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-eye"></i> Детали
                        </a>
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-outline-warning btn-sm">
                            <i class="bi bi-pencil"></i> Ред.
                        </a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Вы уверены, что хотите удалить этот товар?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center my-5 py-5 bg-white rounded-3 shadow-sm" th:if="${#lists.isEmpty(products)}">
        <i class="bi bi-box-seam text-muted display-1"></i>
        <p class="text-muted lead mt-3">Товары не найдены. Попробуйте изменить фильтры или добавьте новый товар.</p>
    </div>
</div>

</body>
</html>
